components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/Error'
      required:
      - success
    PageResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
      required:
      - success
      - data
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    IdResponse:
      type: object
      properties:
        id:
          type: string
      required:
      - id
    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
    Cabinet:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        siteId:
          type: string
        serialNo:
          type: string
        status:
          type: string
    Slot:
      type: object
      properties:
        id:
          type: string
        cabinetId:
          type: string
        slotNo:
          type: string
        status:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
        serviceMode:
          type: string
        originCabinetId:
          type: string
        fulfillmentStoreId:
          type: string
        createdAt:
          type: string
          format: date-time
    Task:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        type:
          type: string
        status:
          type: string
        requiredCount:
          type: integer
        assignees:
          type: array
          items:
            type: string
    EvidenceRecord:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        type:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
    Settlement:
      type: object
      properties:
        id:
          type: string
        period:
          type: string
        status:
          type: string
        totalAmount:
          type: number
    Refund:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        status:
          type: string
        amount:
          type: number
    PayoutAccount:
      type: object
      properties:
        id:
          type: string
        ownerOrgId:
          type: string
        channel:
          type: string
        status:
          type: string
    DeviceInvestor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
    CabinetStoreBinding:
      type: object
      properties:
        id:
          type: string
        cabinetId:
          type: string
        storeId:
          type: string
        bindingType:
          type: string
        status:
          type: string
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
    DeviceEvent:
      type: object
      properties:
        id:
          type: string
        cabinetId:
          type: string
        eventType:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
