- name: finance
  description: 结算/对账/收款账户/退款
- name: audit
  description: 审计与导出
- name: risk
  description: 风控策略与命中记录（占位）
- name: evidence
  description: 证据链上传/记录
- name: iot
  description: IoT 指令/事件（MQTT gateway）
- name: app-customer
  description: 车主端 App API
- name: app-tech
  description: 技师/代泊端 App API
- name: report
  description: 报表与统计（占位）
- name: property
