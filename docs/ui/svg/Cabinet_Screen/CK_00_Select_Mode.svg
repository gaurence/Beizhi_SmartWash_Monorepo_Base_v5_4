<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B1220" flood-opacity="0.18"/>
    </filter>
<filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>
</defs>
<style><![CDATA[
    .font { font-family: 'PingFang SC','Microsoft YaHei','Helvetica','Arial',sans-serif; }
]]></style>
<rect x="0" y="0" width="1080" height="1920" rx="0" ry="0" fill="#F6F7FB" opacity="1.0" />
<rect x="60" y="60" width="960" height="120" rx="24" ry="24" fill="#111827" opacity="1.0" />
<text x="100" y="136" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="start" class="font">备至·智能钥匙柜</text>
<text x="100" y="168" font-size="20" font-weight="600" fill="#CBD5E1" text-anchor="start" class="font">智能钥匙柜 · 自助存取 · 全程可追踪</text>
<rect x="60" y="220" width="960" height="1500" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="100" y="310" font-size="44" font-weight="900" fill="#111827" text-anchor="start" class="font">请选择操作</text>
<text x="100" y="400" font-size="28" font-weight="700" fill="#6B7280" text-anchor="start" class="font">存钥匙 / 取钥匙 / 维护模式</text>
<rect x="120" y="520" width="840" height="140" rx="30" ry="30" fill="#FF7A00" opacity="1.0" />
<text x="540" y="608" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="font">存钥匙</text>
<rect x="120" y="700" width="840" height="140" rx="30" ry="30" fill="#F3F4F6" opacity="1.0" stroke="#E5E7EB" stroke-width="1" />
<text x="540" y="788" font-size="40" font-weight="900" fill="#111827" text-anchor="middle" class="font">取钥匙</text>
<rect x="120" y="880" width="840" height="140" rx="30" ry="30" fill="#F3F4F6" opacity="1.0" stroke="#E5E7EB" stroke-width="1" />
<text x="540" y="968" font-size="40" font-weight="900" fill="#111827" text-anchor="middle" class="font">维护</text>
<text x="140" y="1120" font-size="26" font-weight="600" fill="#111827" text-anchor="start" class="font">• 请使用手机 APP 扫码进行操作</text>
<text x="140" y="1172" font-size="26" font-weight="600" fill="#111827" text-anchor="start" class="font">• 存/取钥匙全程留痕，异常自动上报</text>
<text x="140" y="1224" font-size="26" font-weight="600" fill="#111827" text-anchor="start" class="font">• 如遇问题请联系物业或门店工作人员</text>
</svg>