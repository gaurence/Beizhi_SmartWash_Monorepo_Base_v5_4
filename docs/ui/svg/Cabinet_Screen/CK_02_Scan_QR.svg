      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>
    

    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0B1220" flood-opacity="0.10"/>
    </filter>
    
</defs>
<style><![CDATA[
.font{font-family:'PingFang SC','Microsoft YaHei','Helvetica','Arial',sans-serif;}
]]></style>
<rect x="0" y="0" width="1080" height="1920" rx="0" ry="0" fill="#0B1220" opacity="1.0" />
<circle cx="900" cy="260" r="420" fill="#FF7A00" opacity="0.18"/>
<circle cx="220" cy="1700" r="520" fill="#FF7A00" opacity="0.12"/>
