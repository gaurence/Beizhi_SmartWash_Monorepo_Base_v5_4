<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>
    

    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0B1220" flood-opacity="0.10"/>
    </filter>
    
</defs>
<style><![CDATA[
.font{font-family:'PingFang SC','Microsoft YaHei','Helvetica','Arial',sans-serif;}
]]></style>
<rect x="0" y="0" width="1080" height="1920" rx="0" ry="0" fill="#0B1220" opacity="1.0" />
<circle cx="900" cy="260" r="420" fill="#FF7A00" opacity="0.18"/>
<circle cx="220" cy="1700" r="520" fill="#FF7A00" opacity="0.12"/>
<rect x="60" y="60" width="960" height="120" rx="24" ry="24" fill="#111827" opacity="1.0" />
<text x="100" y="136" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="start" class="font">备至·智能钥匙柜</text>
<text x="100" y="168" font-size="20" font-weight="600" fill="#CBD5E1" text-anchor="start" class="font">智能钥匙柜 · 自助存取 · 全程可追踪</text>
<rect x="60" y="220" width="960" height="1500" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="100" y="310" font-size="44" font-weight="900" fill="#111827" text-anchor="start" class="font">开柜</text>
<text x="100" y="400" font-size="30" font-weight="700" fill="#6B7280" text-anchor="start" class="font">格口已开启</text>
<rect x="120" y="520" width="840" height="260" rx="40" ry="40" fill="#F0F9FF" opacity="1.0" stroke="#E5E7EB" stroke-width="1" />
<text x="540" y="640" font-size="54" font-weight="900" fill="#2563EB" text-anchor="middle" class="font">请打开 S-08 格口门</text>
<text x="540" y="710" font-size="26" font-weight="700" fill="#6B7280" text-anchor="middle" class="font">（门已解锁，轻拉即可）</text>
<rect x="120" y="820" width="840" height="120" rx="30" ry="30" fill="#FF7A00" opacity="1.0" />
<text x="540" y="900" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="font">我已打开</text>
<text x="540" y="980" font-size="22" font-weight="600" fill="#6B7280" text-anchor="middle" class="font">提示：请勿用力拉拽或暴力关闭</text>
</svg>