<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B1220" flood-opacity="0.18"/>
    </filter>
<filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>
</defs>
<style><![CDATA[
    .font { font-family: 'PingFang SC','Microsoft YaHei','Helvetica','Arial',sans-serif; }
]]></style>
<rect x="0" y="0" width="1080" height="1920" rx="0" ry="0" fill="#F6F7FB" opacity="1.0" />
<rect x="60" y="60" width="960" height="120" rx="24" ry="24" fill="#111827" opacity="1.0" />
<text x="100" y="136" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="start" class="font">备至·智能钥匙柜</text>
<text x="100" y="168" font-size="20" font-weight="600" fill="#CBD5E1" text-anchor="start" class="font">智能钥匙柜 · 自助存取 · 全程可追踪</text>
<rect x="60" y="220" width="960" height="1500" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="100" y="310" font-size="44" font-weight="900" fill="#111827" text-anchor="start" class="font">消毒中</text>
<text x="100" y="400" font-size="28" font-weight="700" fill="#6B7280" text-anchor="start" class="font">UVC紫外除菌（可选模块）</text>
<circle cx="540" cy="620" r="80" fill="#EEF2FF" stroke="#2563EB" stroke-width="4"/>
<text x="540" y="640" font-size="64" font-weight="900" fill="#1D4ED8" text-anchor="middle" class="font">✓</text>
<text x="540" y="760" font-size="26" font-weight="700" fill="#6B7280" text-anchor="middle" class="font">请勿将手伸入格口，预计 10 秒完成</text>
</svg>